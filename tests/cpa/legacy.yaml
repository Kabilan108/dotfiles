host: 127.0.0.1
port: 18317
auth-dir: /dummy/auth
api-keys: [dummy-client-one, dummy-client-two]
remote-management:
  allow-remote: true
  secret-key: '$2a$10$dummy-existing-management-hash'
  disable-control-panel: false
  panel-github-repository: https://example.invalid/panel
management: null
debug: true
logging-to-file: true
usage-statistics-enabled: true
error-logs-max-files: 7
request-retry: 4
disable-cooling: false
proxy-url: http://127.0.0.1:18080
oauth-settings:
  claude:
    - name: claude-*
      max-context-length: 123456
oauth-excluded-models:
  codex: [hidden-model]
oauth-model-alias:
  claude:
    - name: claude-source
      alias: claude-alias
      fork: true
oauth-request-scoped-errors:
  claude:
    - status: 429
      match: [operator-limit]
      action: stop
  codex:
    - status: 400
      match: [operator-error]
      action: stop
payload:
  filter:
    - models:
        - name: operator-*
          protocol: openai
      params: [operator-param]
  default:
    - models:
        - name: claude-*
      params:
        temperature: 0.25
codex:
  optimize-multi-agent-v2: true
  websocket-compression: false
claude-api-key:
  - api-key: dummy-claude-key
    base-url: https://example.invalid/claude
    headers: {X-Operator: dummy-header}
    models:
      - name: source-model
        alias: test-model
    request-scoped-errors:
      - status: 404
        match: [per-key-error]
        action: stop
openai-compatibility:
  - name: dummy-provider
    base-url: https://example.invalid/v1
    api-key-entries:
      - api-key: dummy-upstream-one
        weight: 2
      - api-key: dummy-upstream-two
        weight: 3
    models:
      - name: up
        alias: test-model
plugins:
  configs:
    operator-plugin:
      enabled: false
      settings: {operator-setting: preserved}
obsolete-operator-setting: preserved-in-comments
