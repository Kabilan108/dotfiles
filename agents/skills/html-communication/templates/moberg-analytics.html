<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>TITLE · Moberg Analytics</title>
<style>
  :root {
    color-scheme: light;
    --blue: #207dea;
    --blue-dark: #1459ad;
    --blue-tint: #eef5fe;
    --blue-line: #cfe2fb;
    --ink: #14213d;
    --ink-soft: #4a5875;
    --line: #e3e8f0;
    --page: #ffffff;
    --panel: #f7f9fc;
    --code-bg: #f4f7fb;
    --warn: #8a5a00;
    --warn-line: #e0a020;
    --warn-tint: #fff7e6;
  }
  html { background: var(--page); color: var(--ink); }
  body {
    margin: 0;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--page);
    color: var(--ink);
  }
  header.top { border-bottom: 4px solid var(--blue); background: var(--page); }
  .top-inner, main, footer { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  .top-inner { display: flex; align-items: center; gap: 16px; padding-top: 22px; padding-bottom: 18px; }
  .top-inner img { width: 56px; height: 56px; flex: none; }
  .brand { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); font-weight: 700; margin: 0; }
  h1 { font-size: 28px; line-height: 1.2; margin: 2px 0 0; }
  .freshness { color: var(--ink-soft); font-size: 14px; margin: 18px 0 0; }
  .lead { font-size: 18px; color: var(--ink-soft); margin: 16px 0 0; }
  h2 { font-size: 21px; margin: 44px 0 10px; padding-top: 6px; }
  h2 .num { display: inline-block; min-width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 50%; background: var(--blue); color: #fff; font-size: 15px; margin-right: 10px; vertical-align: 2px; }
  h3 { font-size: 17px; margin: 26px 0 6px; }
  a { color: var(--blue-dark); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  pre { background: var(--code-bg); border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: 6px; padding: 14px 16px; overflow-x: auto; font-size: 14px; line-height: 1.5; }
  pre code { background: none; padding: 0; font-size: inherit; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 26px 0 6px; padding: 0; list-style: none; }
  .steps li { background: var(--blue-tint); border: 1px solid var(--blue-line); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
  .steps li b { display: block; color: var(--blue-dark); font-size: 15px; margin-bottom: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 20px 8px; margin-top: 22px; }
  .panel h3 { margin-top: 14px; }
  .panel ul { padding-left: 20px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; margin: 12px 0; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { background: var(--blue-tint); color: var(--blue-dark); font-weight: 600; border-bottom: 1px solid var(--blue-line); }
  td code { white-space: nowrap; }
  .note { background: var(--blue-tint); border-left: 3px solid var(--blue); padding: 10px 14px; border-radius: 0 6px 6px 0; margin: 14px 0; }
  .warn { background: var(--warn-tint); border-left: 3px solid var(--warn-line); padding: 10px 14px; border-radius: 0 6px 6px 0; margin: 14px 0; }
  .warn b { color: var(--warn); }
  details { border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; margin: 12px 0; }
  details summary { cursor: pointer; font-weight: 600; color: var(--blue-dark); }
  .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
  .links a { display: block; border: 1px solid var(--blue-line); border-radius: 8px; padding: 12px 14px; text-decoration: none; background: var(--page); }
  .links a b { display: block; color: var(--blue-dark); }
  .links a span { color: var(--ink-soft); font-size: 14px; }
  footer { margin-top: 56px; padding-top: 18px; padding-bottom: 40px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 14px; }
  @media (max-width: 640px) {
    h1 { font-size: 23px; }
    .top-inner img { width: 44px; height: 44px; }
    .steps, .links { grid-template-columns: 1fr 1fr; }
    td code { white-space: normal; }
  }
</style>
</head>
