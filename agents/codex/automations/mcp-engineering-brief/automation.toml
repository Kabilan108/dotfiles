name = "MCP Engineering Brief"
prompt = "Create the weekday MCP engineering brief for Tony.\n\nWork from /vault/work/moberg/dev-server. Read AGENTS.md and .agents/skills/moberg-pr/SKILL.md before collecting data. Use the existing Bitbucket credentials without printing secrets. Prefer the Bitbucket API for complete workspace-wide data; use Atlas where helpful.\n\nDetermine the reporting window from the latest successfully published PageBin artifact whose filename begins mcp-engineering-brief-. If none exists, cover the preceding seven days. A report counts as successful only after PageBin returns a valid publication result.\n\nCover active MCP repositories. At minimum include dashboard, moberg-data-query-api (Query), iam, cns-manager, cns-utils, moberg-signal-processing, edf-utils, moberg-jupyterhub, moberg-db-patient, moberg-db-iam, code-engine-jobs, code-engine-utils, export-utils, ibm-utils, download-job, upload-job, and ci-cd-pipeline. Also include other independent repositories in the dev-server workspace when they are clearly active MCP components. Prioritize Dashboard, Query, IAM, and the CI/CD coordinator.\n\nGroup related PRs into one change set. Resolve relationships using, in descending confidence:\n1. Explicit entries in each PR's Related PR's/Branches section\n2. CI/CD merge manifests\n3. Shared Jira issue keys\n4. Matching cross-repository branch names\n\nNever group PRs solely because their titles look similar. Within each change set, show the purpose, Jira issue, component PRs, authors, target branches, review state, and CI outcome.\n\nFocus on changes entering testing. Mention staging or main only when meaningful new activity occurred. Include feature and integration branches when they represent active work.\n\nEvaluate CI by final outcome, not isolated attempts. Consider reruns and later commits:\n- If an earlier attempt failed but a rerun succeeded and the PR subsequently merged, omit the failure or mention it only as a minimal resolved note.\n- If the latest relevant result remains failed, stopped, stuck, or otherwise unresolved, make it prominent and link to the failing run.\n- Keep healthy CI details compact.\n- Distinguish component-repository pipelines from the coordinating CI/CD manifest pipeline.\n\nProduce a concise ChatGPT brief addressed to Tony with:\n1. What reached testing\n2. Active linked change sets\n3. CI/CD problems requiring attention\n4. Reviews Tony owes\n5. Tony's PRs waiting on others\n6. Other important changes\n7. A compact stale-PR summary\n\nUse Bitbucket username Kabilan108 only for identity matching. Refer to the user as Tony in report prose.\n\nUnder Reviews Tony owes, include:\n- PRs where Tony has not reviewed\n- PRs where Tony reviewed but the author pushed changes afterward\n- PRs where Tony requested changes and the author subsequently updated them\n\nUnder Tony's PRs waiting on others, distinguish:\n- Awaiting initial review\n- Reviewer comments awaiting Tony's response\n- Tony updated the PR after feedback and is awaiting re-review\n- Approved but blocked by another reviewer, CI, or merge coordination\n\nMark PRs unchanged for at least 30 days as stale. Include them in the HTML report without overemphasizing them in the ChatGPT brief. Preserve any previously recorded instruction to suppress a known intentionally deferred PR until it changes.\n\nGenerate a polished standalone HTML report named mcp-engineering-brief-YYYY-MM-DD.html. Include repository and change-set drill-downs, direct Bitbucket and pipeline links, timestamps, review histories, CI conclusions, and a clearly separated stale section. Publish it using PageBin with JSON output and a 30-day TTL. Verify publication with a GET against the returned /raw/ artifact route.\n\nEnd the ChatGPT brief with the protected PageBin viewer link. If Bitbucket collection or PageBin publication fails, report the failure clearly and do not advance the successful-report window."
