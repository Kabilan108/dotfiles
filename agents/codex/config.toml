model = "gpt-5.3-codex"

model_reasoning_effort = "high"
model_supports_reasoning_summaries = true

sandbox_mode = "workspace-write"

notify = ["/home/kabilan/dotfiles/bin/codex-notify"]
personality = "pragmatic"

[sandbox_workspace_write]
network_access = true

[shell_environment_policy]
inherit = "all"

[features]
skills = true
unified_exec = true
shell_snapshot = true
steer = true
multi-agent = true

[history]
persistence = "save-all"

[mcp_servers.nixos]
command = "nix"
args = ["run", "github:utensils/mcp-nixos"]

[mcp_servers.exa]
url = "https://sietch.sole-pierce.ts.net/exa-mcp/mcp?tools=web_search_exa,get_code_context_exa,crawling_exa,deep_researcher_start,deep_researcher_check"

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"

[notice]
hide_gpt5_1_migration_prompt = true
"hide_gpt-5.1-codex-max_migration_prompt" = true

[notice.model_migrations]
"gpt-5.2" = "gpt-5.2-codex"

[projects."/vault/repos/OtakuDex"]
trust_level = "trusted"

