[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume>  <label-volume>

label-volume = %percentage%%
label-volume-foreground = ${colors.green}

label-muted = "󰝟 "
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 
ramp-volume-4 = 
ramp-volume-5 = 
ramp-volume-6 = 
ramp-volume-foreground = ${colors.green}

