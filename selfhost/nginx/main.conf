# HTTP server block to redirect to HTTPS
server {
    listen 80;
    server_name ${TAILSCALE_URL} ${TAILSCALE_NAME} ${TAILSCALE_IP}; # Listen on FQDN, short name, and IP

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl;
    http2 on;
    server_name ${TAILSCALE_URL}; # Primary server name

    # SSL Certificate paths (matching the mounts in docker-compose.yml)
    ssl_certificate /etc/ssl/certs/tailscale.crt;
    ssl_certificate_key /etc/ssl/private/tailscale.key;

    # SSL hardening (recommended settings)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 128M;

    resolver 127.0.0.11 valid=10s;

    # --- Vaultwarden
    location = /vw {
        return 301 https://$host/vw/; # Ensure redirect uses https
    }

    location /vw/ {
        proxy_pass http://vaultwarden:80; # Internal traffic is still HTTP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # $scheme will be 'https'
        proxy_set_header X-Forwarded-Host $host;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location /vw/notifications/hub {
        proxy_pass http://vaultwarden:80; # Internal traffic is still HTTP
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # --- Jellyfin
    location /jellyfin {
        return 301 https://$host/jellyfin/;
    }

    location /jellyfin/ {
        proxy_pass http://jellyfin:8096/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_buffering off;
        proxy_http_version 1.1;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # --- Siren
    location /siren {
        return 301 https://$host/siren/;
    }

    location /siren/ {
        set $siren http://siren:8000;
        rewrite ^/siren/(.*) /$1 break;
        proxy_pass $siren;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_http_version 1.1;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # --- Llama Server
    location /llama-server {
        return 301 https://$host/llama-server/;
    }

    location /llama-server/ {
        set $llama http://llama-server:8012;
        rewrite ^/llama-server/(.*) /$1 break;
        proxy_pass $llama;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_http_version 1.1;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # --- Exa MCP
    location /exa-mcp {
        return 301 https://$host/exa-mcp/;
    }

    location /exa-mcp/ {
        set $exa http://exa-mcp:8081;
        rewrite ^/exa-mcp/(.*) /$1 break;
        proxy_pass $exa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_http_version 1.1;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # --- Fallthrough
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }
}
