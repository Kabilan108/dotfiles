services:
  nginx:
    container_name: nginx
    image: nginx:alpine
    networks:
      - proxynet
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./nginx/certs/${TAILSCALE_URL}.crt:/etc/ssl/certs/tailscale.crt:ro
      - ./nginx/certs/${TAILSCALE_URL}.key:/etc/ssl/private/tailscale.key:ro
    environment:
      TAILSCALE_NAME: ${TAILSCALE_NAME}
      TAILSCALE_IP: ${TAILSCALE_IP}
      TAILSCALE_URL: ${TAILSCALE_URL}

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      - proxynet
    environment:
      DOMAIN: "https://${TAILSCALE_URL}/vw"
      SIGNUPS_ALLOWED: "false"
      # ADMIN_TOKEN: ""
    volumes:
      - vaultwarden-data:/data/

  jellyfin:
    container_name: jellyfin
    devices:
      - /dev/dri:/dev/dri  # hardware acceleration
    entrypoint: ["/entrypoint.sh"]
    environment:
      - JELLYFIN_PublishedServerUrl=https://${TAILSCALE_URL}/jellyfin
    image: jellyfin/jellyfin:latest
    networks:
      - proxynet
    restart: unless-stopped
    user: 1000:1000
    volumes:
      - jellyfin-data:/config
      - ./jellyfin/entrypoint.sh:/entrypoint.sh
      - /library:/media
      - /etc/localtime:/etc/localtime:ro

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    networks:
      - proxynet
    volumes:
      - ${USER_DATA}/ggufs:/models
    devices:
      - nvidia.com/gpu=all
    command: >
      --host 0.0.0.0 --port 8000 -ngl 99 -fa -dt 0.1 --ubatch-size 512 --batch-size 1024 --ctx-size 0 --cache-reuse 256 -m /models/zed-industries_zeta-Q6_K_L.gguf


  siren:
    container_name: siren
    build:
      context: https://github.com/kabilan108/siren.git
      dockerfile: Dockerfile.gpu
    restart: unless-stopped
    networks:
      - proxynet
    environment:
      - SIREN_API_KEY=${SIREN_API_KEY}
    volumes:
      - ${HF_HOME}:/root/.cache/huggingface
    devices:
      - nvidia.com/gpu=all

  open-webui:
    container_name: open-webui
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - ENV=dev  # enable /docs
      - ENABLE_SIGNUP=True
      - DEFAULT_USER_ROLE=admin

      # set model for title generation, web search
      - TASK_MODEL_EXTERNAL=openai/gpt-4o-mini

      # - ENABLE_RAG_WEB_SEARCH=True
      # - RAG_WEB_SEARCH_ENGINE=google_pse

      - RAG_EMBEDDING_MODEL_AUTO_UPDATE=True
      - RAG_RERANKING_MODEL_AUTO_UPDATE=True
      - RAG_EMBEDDING_MODEL_TRUST_REMOTE_CODE=True
      - RAG_RERANKING_MODEL_TRUST_REMOTE_CODE=True

      - WHISPER_MODEL=base

      - ENABLE_OLLAMA_API=False

      - OPENAI_API_KEY=${OPENAI_API_KEY}
    image: ghcr.io/open-webui/open-webui:main
    networks:
      - proxynet
    ports:
      - "7000:8080"
    restart: unless-stopped
    volumes:
      - open-webui-data:/app/backend/data

networks:
  proxynet:

volumes:
  vaultwarden-data:
  jellyfin-data:
  open-webui-data:
