# Builds ci/cache-packages and publishes them to kabilan108.cachix.org.
#
# Only deploy tags publish. The "deploy tags" ruleset lets only the repo's
# deploy keys (Tony's YubiKeys) create deploy/** tags, and the cache-publish
# environment, which holds the push token, accepts only deploy/*/* refs. So
# the token reaches only workflow code from a commit Tony signed.
#
# Only deploy tags build, too. Pull requests run just the plan job, which
# catches eval and planning failures before merge. A pull request build
# could not seed the cache, so the deploy run would repeat it anyway.
#
# Nothing here may restore an Actions cache or another run's artifacts: a
# branch run could have written them, and publishing them would poison the
# cache. The one artifact read here is the plan job's derivation closure,
# from the same run. Only jobs of this run can write it, and they run this
# file from the same commit. download-artifact reads the current run when
# given no run-id, so never give it one.
#
# The build jobs don't evaluate the flake. The plan job evaluates it once and
# passes each package's derivation paths through its outputs, with their
# closures in that artifact. A build job imports only its own derivations,
# which the store checks against their content addresses, and refuses any
# that aren't a build of its package.
name: cache

on:
  push:
    tags: ["deploy/**"]
  pull_request:
    paths:
      - flake.lock
      - flake.nix
      - packages/**
      - modules/nixos/wayland/niri.nix
      - ci/**
      - .github/workflows/cache.yml

permissions:
  contents: read

concurrency:
  group: cache-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# An explicit bash gets -o pipefail.
defaults:
  run:
    shell: bash

env:
  NIX_CONFIG: |
    extra-substituters = https://kabilan108.cachix.org
    extra-trusted-public-keys = kabilan108.cachix.org-1:g8OqmhpqE1Bz9DjKTV17uQ3yzsfGcDB5fDgGfVC4t/o=

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      drvs: ${{ steps.plan.outputs.drvs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - id: plan
        run: |
          python3 ci/cache-targets.py plan "$RUNNER_TEMP/drvs" > "$RUNNER_TEMP/plan.json"
          echo "packages=$(jq -c .packages "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          echo "drvs=$(jq -c .drvs "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
      # The NARs inside are zstd-compressed already. A re-run of this job
      # replaces the artifact, and a day leaves time to re-run failed builds.
      - if: steps.plan.outputs.packages != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drvs
          path: ${{ runner.temp }}/drvs
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  build:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: ${{ github.event_name == 'push' && 'cache-publish' || '' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    name: build ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drvs
          path: ${{ runner.temp }}/drvs
      - name: Build
        env:
          PACKAGE: ${{ matrix.package }}
          DRVS: ${{ toJSON(fromJSON(needs.plan.outputs.drvs)[matrix.package]) }}
        run: |
          jq -r '.[]' <<< "$DRVS" > "$RUNNER_TEMP/drvs.txt"
          mapfile -t drvs < "$RUNNER_TEMP/drvs.txt"
          python3 ci/cache-targets.py import "$PACKAGE" "$RUNNER_TEMP/drvs" "${drvs[@]}"
          nix build --no-link --print-out-paths -L "${drvs[@]/%/^*}" | tee "$RUNNER_TEMP/outputs"
      # The space a build leaves, now that jobs keep the runner's preinstalled
      # toolchains instead of deleting them first.
      - name: Disk space
        if: always()
        run: df -h /
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/deploy/')
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          mapfile -t outputs < "$RUNNER_TEMP/outputs"
          nix run --inputs-from . nixpkgs#cachix -- push --compression-level 8 kabilan108 "${outputs[@]}"
